name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spark_owner
          POSTGRES_PASSWORD: spark_owner
          POSTGRES_DB: spark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spark_owner -d spark_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: "postgresql://spark_owner:spark_owner@localhost:5432/spark_test?schema=public"
      APP_DATABASE_URL: "postgresql://spark_owner:spark_owner@localhost:5432/spark_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      # CI-only dummy secrets so `next build` can resolve the auth config.
      AUTH_SECRET: "ci-dummy-secret-not-used-in-production"
      AUTH_URL: "http://localhost:3000"
      TOKEN_ENCRYPTION_KEY: "Y2ktZHVtbXkta2V5LWZvci1jaS1idWlsZHMtb25seQ=="

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @spark/db migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
